<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula - Login Smart City</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tema (Gelap/Terang) — diterapkan sebelum render untuk mencegah kedip warna -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('nebula-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <style>
        /* --- STYLES UNTUK POP-UP MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 2.5rem;
            color: #EAB308;
            margin-bottom: 12px;
        }

        .modal-card h3 {
            font-size: 1.25rem;
            color: #0F172A;
            margin-bottom: 8px;
        }

        .modal-card p {
            color: #64748B;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-modal-close {
            background-color: #4F46E5;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-modal-close:hover {
            background-color: #4338CA;
        }

        /* Styling pesan error email */
        .error-message {
            color: #EF4444;
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body class="login-body">
    <button class="login-theme-toggle theme-toggle" id="themeToggle" title="Ganti tema" aria-label="Ganti tema">
        <i class="fa-solid fa-sun"></i>
    </button>
    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-compact-disc"></i>
            <h2>Nebula</h2>
            <p>Portal Manajemen Smart City</p>
        </div>
        
        <!-- Form login -->
        <form action="index.html" class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input 
                        type="text" 
                        id="email" 
                        placeholder="contoh@gmail.com" 
                        required>
                </div>
                <small class="error-message" id="emailError">Email harus menggunakan domain @gmail.com</small>
            </div>
            
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked> Ingat sesi saya
                </label>
                <a href="#" id="forgotPasswordBtn" class="forgot-password">Lupa sandi?</a>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Masuk ke Dashboard</button>
        </form>
    </div>

    <!-- POP-UP MODAL LUPA SANDI -->
    <div class="modal-overlay" id="prototypeModal">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Pemberitahuan</h3>
            <p>Mohon maaf, ini hanya prototype.</p>
            <button class="btn-plain" id="closeModalBtn">Tutup</button>
        </div>
    </div>

    <!-- JAVASCRIPT UNTUK VALIDASI & POP-UP -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');

            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const prototypeModal = document.getElementById('prototypeModal');
            const closeModalBtn = document.getElementById('closeModalBtn');

            // --- 1. Validasi Wajib @gmail.com saat Submit ---
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    const emailValue = emailInput.value.trim().toLowerCase();

                    // Cek apakah email diakhiri dengan @gmail.com
                    if (!emailValue.endsWith('@gmail.com')) {
                        e.preventDefault(); // Stop proses kirim form / pindah halaman
                        emailError.classList.add('show');
                        emailInput.focus();
                    } else {
                        emailError.classList.remove('show');
                        // Form akan otomatis lanjut berpindah ke index.html
                    }
                });
            }

            // --- 2. Sembunyikan Pesan Error Saat User Mulai Ketik Lagi ---
            if (emailInput) {
                emailInput.addEventListener('input', () => {
                    emailError.classList.remove('show');
                });
            }

            // --- 3. Pop-up Modal Lupa Sandi ---
            if (forgotPasswordBtn && prototypeModal) {
                forgotPasswordBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    prototypeModal.classList.add('active');
                });
            }

            if (closeModalBtn && prototypeModal) {
                closeModalBtn.addEventListener('click', () => {
                    prototypeModal.classList.remove('active');
                });
            }

            if (prototypeModal) {
                prototypeModal.addEventListener('click', (e) => {
                    if (e.target === prototypeModal) {
                        prototypeModal.classList.remove('active');
                    }
                });
            }
        });

        // ====== THEME (GELAP / TERANG) TOGGLE ======
        (function () {
            const root = document.documentElement;

            function currentTheme() {
                return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            }

            function syncIcon(btn) {
                const icon = btn && btn.querySelector('i');
                if (icon) icon.className = currentTheme() === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }

            document.querySelectorAll('.theme-toggle, .login-theme-toggle').forEach((btn) => {
                syncIcon(btn);
                btn.addEventListener('click', () => {
                    const next = currentTheme() === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', next);
                    try { localStorage.setItem('nebula-theme', next); } catch (e) {}
                    document.querySelectorAll('.theme-toggle, .login-theme-toggle').forEach(syncIcon);
                });
            });
        })();
    </script>
</body>
</html>
